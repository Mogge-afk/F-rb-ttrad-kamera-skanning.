<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR & Streckkodsläsare - Endast Bakkamera med Lampa & Zoom</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 40px;
    }
    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      text-align: center;
      padding: 4px 0 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .subhead {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* KAMERA VIEWPORT */
    .viewport-card {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 480px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid #1e293b;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.15s ease-out;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: cover;
    }

    /* Siktram och laser */
    .scanner-aim {
      position: absolute;
      width: 72%;
      height: 55%;
      border: 2px solid rgba(56, 189, 248, 0.7);
      border-radius: 18px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .laser-line {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 2px;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8, 0 0 18px #0284c7;
      animation: laserScan 2s infinite ease-in-out;
    }
    @keyframes laserScan {
      0% { top: 5%; opacity: 0.2; }
      50% { top: 92%; opacity: 1; }
      100% { top: 5%; opacity: 0.2; }
    }

    /* Overlay knappar på kameran */
    .overlay-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .btn-cam-control {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-cam-control:active {
      transform: scale(0.96);
    }
    .torch-active {
      background: #f59e0b !important;
      color: #000 !important;
      border-color: #fbbf24 !important;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    /* ZOOM KONTROLLER */
    .zoom-panel {
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .zoom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }
    .zoom-val {
      color: #38bdf8;
      font-weight: 700;
      font-size: 14px;
    }
    .zoom-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zoom-slider {
      flex: 1;
      height: 6px;
      accent-color: #38bdf8;
      background: #1e293b;
      border-radius: 4px;
      outline: none;
    }
    .zoom-presets {
      display: flex;
      gap: 6px;
    }
    .btn-preset {
      flex: 1;
      padding: 7px 0;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-preset.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    /* KAMERAVAL PANEL */
    .cam-panel {
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cam-label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
    .cam-select {
      width: 100%;
      padding: 11px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
    }
    .cam-select:focus {
      border-color: #38bdf8;
    }

    /* STATUS VISNING */
    .status-card {
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s;
    }
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .badge-idle { background: #334155; color: #94a3b8; }
    .badge-ok { background: #10b981; color: #022c22; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    .badge-dup { background: #ef4444; color: #450a0a; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    .status-val {
      font-size: 18px;
      font-weight: 700;
      word-break: break-all;
      min-height: 26px;
    }

    /* RÄKNARE */
    .counters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .cnt-box {
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .cnt-num {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }
    .cnt-txt {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }

    /* MANUELL OCH EXTRA */
    .manual-row {
      display: flex;
      gap: 8px;
    }
    .manual-input {
      flex: 1;
      padding: 12px 14px;
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .manual-input:focus {
      border-color: #38bdf8;
    }
    .btn-action {
      padding: 12px 16px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-action:active {
      transform: scale(0.97);
    }

    /* HISTORIKLISTA */
    .history-card {
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 14px;
    }
    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
    .btn-clear {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 12px;
      cursor: pointer;
    }
    .history-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 13px;
      gap: 8px;
    }
    .item-val {
      font-family: monospace;
      font-weight: 600;
      word-break: break-all;
    }
    .item-dup { color: #f87171; font-size: 11px; font-weight: 700; }
    .item-ok { color: #34d399; font-size: 11px; font-weight: 700; }

    #camMsg {
      font-size: 12px;
      color: #f59e0b;
      text-align: center;
      min-height: 16px;
    }
  </style>

  <!-- jsQR som pålitlig fallback i fall BarcodeDetector inte finns -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

<div class="wrapper">
  <header>
    <h1>QR & Streckkodsläsare</h1>
    <div class="subhead">Endast bakkamera • Med lampa & zoom</div>
  </header>

  <!-- KAMERA VIEWPORT -->
  <div class="viewport-card">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>

    <div class="scanner-aim">
      <div class="laser-line"></div>
    </div>

    <!-- Kontroller ovanpå videon -->
    <div class="overlay-controls">
      <button id="torchBtn" class="btn-cam-control" onclick="toggleTorch()">
        🔦 <span>Lampa PÅ</span>
      </button>

      <button id="switchBtn" class="btn-cam-control" onclick="cycleBackCamera()">
        🔄 <span>Byt bakkamera</span>
      </button>
    </div>
  </div>

  <div id="camMsg">Startar kameran...</div>

  <!-- ZOOM-KONTROLL -->
  <div class="zoom-panel">
    <div class="zoom-header">
      <span>🔍 Zoomnivå</span>
      <span id="zoomVal" class="zoom-val">1.0x</span>
    </div>
    <div class="zoom-row">
      <span style="font-size: 12px; color: #64748b;">1x</span>
      <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="setZoom(this.value)">
      <span id="maxZoomLabel" style="font-size: 12px; color: #64748b;">5x</span>
    </div>
    <div class="zoom-presets">
      <button class="btn-preset active" onclick="setZoom(1)">1x</button>
      <button class="btn-preset" onclick="setZoom(1.5)">1.5x</button>
      <button class="btn-preset" onclick="setZoom(2)">2x</button>
      <button class="btn-preset" onclick="setZoom(3)">3x</button>
      <button class="btn-preset" onclick="setZoom(5)">5x</button>
    </div>
  </div>

  <!-- BAKKAMERA VAL -->
  <div class="cam-panel">
    <div class="cam-label">
      <span>📷 Vald bakkamera (inga frontkameror):</span>
      <span id="camCountLabel" style="color: #38bdf8;">0 hittade</span>
    </div>
    <select id="camSelect" class="cam-select" onchange="onCameraSelected(this.value)">
      <option value="">Söker efter bakkameror...</option>
    </select>
  </div>

  <!-- STATUSKORT -->
  <div class="status-card" id="statusCard">
    <div id="statusBadge" class="status-badge badge-idle">Väntar på kod...</div>
    <div id="statusVal" class="status-val">-</div>
  </div>

  <!-- RÄKNARE -->
  <div class="counters">
    <div class="cnt-box">
      <div id="cntTotal" class="cnt-num">0</div>
      <div class="cnt-txt">Totalt</div>
    </div>
    <div class="cnt-box">
      <div id="cntUnique" class="cnt-num" style="color: #34d399;">0</div>
      <div class="cnt-txt">Godkända</div>
    </div>
    <div class="cnt-box">
      <div id="cntDups" class="cnt-num" style="color: #f87171;">0</div>
      <div class="cnt-txt">Dubletter</div>
    </div>
  </div>

  <!-- MANUELL INMATNING & TEST -->
  <div class="manual-row">
    <input id="manualInput" class="manual-input" type="text" placeholder="Skriv in eller skanna med pistol...">
    <button class="btn-action" onclick="submitManual()">OK</button>
  </div>

  <!-- HISTORIK -->
  <div class="history-card">
    <div class="history-head">
      <span>Senaste skannade koder</span>
      <button class="btn-clear" onclick="clearHistory()">Rensa allt</button>
    </div>
    <div id="historyList" class="history-list">
      <div style="text-align: center; color: #475569; font-size: 12px; padding: 12px;">Inga koder skannade än</div>
    </div>
  </div>
</div>

<script>
// TILLSTÅND
let currentStream = null;
let currentTrack = null;
let backCameras = [];
let selectedDeviceId = null;
let isTorchOn = false;
let currentZoom = 1;
let hardwareZoomSupported = false;
let zoomMin = 1;
let zoomMax = 5;
let zoomStep = 0.1;

let scans = [];
let scanCount = 0;
let dupCount = 0;
let lastCode = null;
let lastCodeTime = 0;
let animFrameId = null;

// Audio Context för omedelbart ljud utan fördröjning
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playBeep(freq, dur, type = 'sine') {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur / 1000);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur / 1000);
  } catch(e) {}
}

function onCodeSuccess(code) {
  playBeep(880, 110, 'sine');
  if (navigator.vibrate) navigator.vibrate(80);
}

function onCodeDup(code) {
  playBeep(220, 180, 'sawtooth');
  setTimeout(() => playBeep(180, 160, 'sawtooth'), 100);
  if (navigator.vibrate) navigator.vibrate([90, 60, 120]);
}

// ------------------- SKANNINGSLOGIK -------------------
function processScan(code) {
  if (!code) return;
  code = code.trim();
  if (!code) return;

  const now = Date.now();
  // Cooldown så den inte triggar 30 gånger per sekund på samma kod
  if (code === lastCode && (now - lastCodeTime < 1800)) {
    return;
  }
  lastCode = code;
  lastCodeTime = now;

  scanCount++;
  const exists = scans.includes(code);

  const card = document.getElementById("statusCard");
  const badge = document.getElementById("statusBadge");
  const val = document.getElementById("statusVal");

  val.innerText = code;

  if (exists) {
    dupCount++;
    badge.className = "status-badge badge-dup";
    badge.innerText = "DUPLIKAT (REDAN SKANNAD!)";
    onCodeDup(code);
  } else {
    scans.push(code);
    badge.className = "status-badge badge-ok";
    badge.innerText = "GODKÄND (NY KOD)";
    onCodeSuccess(code);
  }

  updateUI(code, exists);
}

function updateUI(code, isDup) {
  document.getElementById("cntTotal").innerText = scanCount;
  document.getElementById("cntUnique").innerText = scans.length;
  document.getElementById("cntDups").innerText = dupCount;

  const list = document.getElementById("historyList");
  if (scanCount === 1) list.innerHTML = "";

  const time = new Date().toLocaleTimeString();
  const div = document.createElement("div");
  div.className = "history-item";
  div.innerHTML = `
    <div>
      <span style="color:#64748b; font-size:11px; margin-right:4px;">${time}</span>
      <span class="item-val">${escapeHtml(code)}</span>
    </div>
    <span class="${isDup ? 'item-dup' : 'item-ok'}">${isDup ? 'DUPLIKAT' : 'GODKÄND'}</span>
  `;
  list.prepend(div);
  if (list.children.length > 30) list.removeChild(list.lastChild);
}

function escapeHtml(t) {
  const d = document.createElement("div");
  d.innerText = t;
  return d.innerHTML;
}

function submitManual() {
  const inp = document.getElementById("manualInput");
  if (!inp.value.trim()) return;
  processScan(inp.value.trim());
  inp.value = "";
}
document.getElementById("manualInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitManual();
});

function clearHistory() {
  if (!confirm("Vill du nollställa historiken?")) return;
  scans = [];
  scanCount = 0;
  dupCount = 0;
  lastCode = null;
  document.getElementById("cntTotal").innerText = "0";
  document.getElementById("cntUnique").innerText = "0";
  document.getElementById("cntDups").innerText = "0";
  document.getElementById("statusBadge").className = "status-badge badge-idle";
  document.getElementById("statusBadge").innerText = "Väntar på kod...";
  document.getElementById("statusVal").innerText = "-";
  document.getElementById("historyList").innerHTML = '<div style="text-align: center; color: #475569; font-size: 12px; padding: 12px;">Inga koder skannade än</div>';
}

// ------------------- KAMERAHANTERING: ENDAST BAKKAMERA -------------------

// Filtrera bort ALLA fram-/selfiekameror
function isFrontCamera(label) {
  if (!label) return false;
  return /front|fram|selfie|user|face/i.test(label);
}

async function discoverBackCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');

    // Sortera ut ENBART bakkameror (filtrera strikt bort front)
    const filtered = videoDevices.filter(d => !isFrontCamera(d.label));

    // Om etiketter ännu inte var synliga (innan behörighet givits), spara videoDevices
    backCameras = filtered.length > 0 ? filtered : videoDevices;

    const select = document.getElementById("camSelect");
    select.innerHTML = "";

    backCameras.forEach((cam, index) => {
      const opt = document.createElement("option");
      opt.value = cam.deviceId;
      let label = cam.label;
      if (!label) {
        label = `Bakkamera ${index + 1}`;
      } else {
        // Tydliggör linstyp om den finns i namnet (t.ex. vidvinkel, tele)
        if (/ultra|wide|0\./i.test(label)) label += " (Vidvinkel)";
        else if (/tele|zoom|[2-5]x/i.test(label)) label += " (Zoom/Tele)";
      }
      opt.text = label;
      select.appendChild(opt);
    });

    document.getElementById("camCountLabel").innerText = `${backCameras.length} bakkamera(or)`;
    if (selectedDeviceId) {
      select.value = selectedDeviceId;
    }
  } catch(e) {
    console.error("Fel vid kameraupptäckt:", e);
  }
}

async function startCamera(deviceId = null) {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
    currentTrack = null;
  }

  const msg = document.getElementById("camMsg");
  msg.innerText = "Startar bakkamera...";

  // Bygg constraints som TILL 100% begär bakkamera ('environment')
  const constraintsList = [];

  if (deviceId) {
    constraintsList.push({
      video: {
        deviceId: { exact: deviceId },
        width: { ideal: 1920, min: 1280 },
        height: { ideal: 1080, min: 720 },
      }
    });
    constraintsList.push({ video: { deviceId: { exact: deviceId } } });
  } else {
    // Mobil bakkamera med ideal 1080p för skarp QR/streckkodsläsning
    constraintsList.push({
      video: {
        facingMode: { exact: "environment" },
        width: { ideal: 1920, min: 1280 },
        height: { ideal: 1080, min: 720 }
      }
    });
    constraintsList.push({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
    constraintsList.push({ video: { facingMode: "environment" } });
    constraintsList.push({ video: true }); // Fallback på PC
  }

  let stream = null;
  for (let c of constraintsList) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      if (stream) break;
    } catch(err) {
      // Prova nästa constraint
    }
  }

  if (!stream) {
    msg.innerText = "Kunde inte öppna kameran. Kontrollera tillstånd!";
    return;
  }

  currentStream = stream;
  currentTrack = stream.getVideoTracks()[0];
  selectedDeviceId = currentTrack.getSettings ? currentTrack.getSettings().deviceId : null;

  const video = document.getElementById("video");
  video.srcObject = stream;
  await video.play();

  // Upptäck kameror nu när behörighet garanterat finns
  await discoverBackCameras();

  initTorchAndZoom();
  msg.innerText = `Aktiv: ${currentTrack.label || "Bakkamera"}`;

  startScanningLoop();
}

function onCameraSelected(id) {
  if (!id) return;
  selectedDeviceId = id;
  startCamera(id);
}

function cycleBackCamera() {
  if (backCameras.length < 2) {
    document.getElementById("camMsg").innerText = "Endast en bakkamera upptäckt på denna enhet.";
    return;
  }
  const currentIndex = backCameras.findIndex(c => c.deviceId === selectedDeviceId);
  const nextIndex = (currentIndex + 1) % backCameras.length;
  const nextCam = backCameras[nextIndex];
  if (nextCam) {
    selectedDeviceId = nextCam.deviceId;
    document.getElementById("camSelect").value = nextCam.deviceId;
    startCamera(nextCam.deviceId);
  }
}

// ------------------- LAMPA (TORCH) -------------------
function initTorchAndZoom() {
  if (!currentTrack) return;
  const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};

  // 1. LAMPA
  const torchBtn = document.getElementById("torchBtn");
  isTorchOn = false;
  torchBtn.className = "btn-cam-control";
  torchBtn.querySelector("span").innerText = "Lampa PÅ";

  if ('torch' in caps) {
    torchBtn.style.display = "inline-flex";
  } else {
    // Vissa mobiler gömmer torch tills streamen är aktiv en sekund
    torchBtn.style.display = "inline-flex";
  }

  // 2. ZOOM
  const slider = document.getElementById("zoomSlider");
  if ('zoom' in caps) {
    hardwareZoomSupported = true;
    zoomMin = caps.zoom.min || 1;
    zoomMax = caps.zoom.max || 5;
    zoomStep = caps.zoom.step || 0.1;
    slider.min = zoomMin;
    slider.max = zoomMax;
    slider.step = zoomStep;
    document.getElementById("maxZoomLabel").innerText = `${Math.round(zoomMax)}x`;
  } else {
    // Mjukvaru-/digital zoom fallback (förstorar videon och klipper i canvas!)
    hardwareZoomSupported = false;
    zoomMin = 1;
    zoomMax = 5;
    zoomStep = 0.1;
    slider.min = 1;
    slider.max = 5;
  }

  setZoom(1);
}

async function toggleTorch() {
  if (!currentTrack) return;
  const torchBtn = document.getElementById("torchBtn");
  const nextState = !isTorchOn;

  try {
    // Applicera torch constraint på videospåret
    await currentTrack.applyConstraints({
      advanced: [{ torch: nextState }]
    });
    isTorchOn = nextState;
    if (isTorchOn) {
      torchBtn.className = "btn-cam-control torch-active";
      torchBtn.querySelector("span").innerText = "Lampa AV";
    } else {
      torchBtn.className = "btn-cam-control";
      torchBtn.querySelector("span").innerText = "Lampa PÅ";
    }
  } catch (err) {
    console.warn("Kunde inte ändra lampa:", err);
    document.getElementById("camMsg").innerText = "Ficklampa stöds ej på denna lins.";
  }
}

// ------------------- ZOOM (HÅRDVARA + DIGITAL FALLBACK) -------------------
async function setZoom(val) {
  val = parseFloat(val);
  if (isNaN(val)) return;
  currentZoom = val;

  document.getElementById("zoomSlider").value = val;
  document.getElementById("zoomVal").innerText = `${val.toFixed(1)}x`;

  // Uppdatera aktiv stil på preset-knappar
  document.querySelectorAll(".btn-preset").forEach(btn => {
    const pVal = parseFloat(btn.innerText);
    if (Math.abs(pVal - val) < 0.1) {
      btn.classList.add("active");
    } else {
      btn.classList.remove("active");
    }
  });

  // 1. Försök med hårdvaruzoom på kameran
  if (hardwareZoomSupported && currentTrack) {
    try {
      await currentTrack.applyConstraints({
        advanced: [{ zoom: val }]
      });
      // Återställ videotransform om hårdvaran sköter det
      document.getElementById("video").style.transform = "scale(1)";
      return;
    } catch(e) {
      // Gå vidare till mjukvaruzoom om det misslyckas
    }
  }

  // 2. Mjukvaru-zoom fallback (CSS scale på video, och inzoomad canvas crop för scanning!)
  const video = document.getElementById("video");
  video.style.transform = `scale(${val})`;
  video.style.transformOrigin = "center center";
}

// ------------------- SKANNINGSLOOP (BarcodeDetector + jsQR) -------------------
function startScanningLoop() {
  if (animFrameId) cancelAnimationFrame(animFrameId);

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  // Native BarcodeDetector (klarar QR, EAN-13, Code 128, Datamatrix etc)
  let barcodeDetector = null;
  if ('BarcodeDetector' in window) {
    try {
      barcodeDetector = new window.BarcodeDetector({
        formats: ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'data_matrix']
      });
    } catch(e) {}
  }

  let lastDetectTimestamp = 0;

  async function tick(timestamp) {
    if (!video.videoWidth || !video.videoHeight) {
      animFrameId = requestAnimationFrame(tick);
      return;
    }

    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    // Om digital zoom används, zooma in mitten av bildrutan på canvas
    if (!hardwareZoomSupported && currentZoom > 1) {
      const sw = video.videoWidth / currentZoom;
      const sh = video.videoHeight / currentZoom;
      const sx = (video.videoWidth - sw) / 2;
      const sy = (video.videoHeight - sh) / 2;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }

    // Analysera bild ~15-20 ggr per sekund
    if (timestamp - lastDetectTimestamp > 60) {
      lastDetectTimestamp = timestamp;
      let detectedText = null;

      // 1. Prova BarcodeDetector
      if (barcodeDetector) {
        try {
          const results = await barcodeDetector.detect(canvas);
          if (results && results.length > 0) {
            detectedText = results[0].rawValue;
          }
        } catch(e) {}
      }

      // 2. jsQR Fallback för QR-koder
      if (!detectedText && typeof jsQR === 'function') {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts: "dontInvert"
        });
        if (code && code.data) {
          detectedText = code.data;
        }
      }

      if (detectedText) {
        processScan(detectedText);
      }
    }

    animFrameId = requestAnimationFrame(tick);
  }

  animFrameId = requestAnimationFrame(tick);
}

// Starta direkt vid laddning
window.addEventListener("DOMContentLoaded", () => {
  // Tillåt användarinteraktion för ljud
  document.body.addEventListener("click", () => getAudio(), { once: true });
  startCamera();
});
</script>
